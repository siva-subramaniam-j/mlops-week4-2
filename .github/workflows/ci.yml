name: MLOps CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up DVC
        uses: iterative/setup-dvc@v2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Pull versioned data and model (DVC)
        run: dvc pull -f


      - name: Run pytest suite
        run: |
          pytest tests/ -v --junitxml=report.xml | tee pytest_output.txt
        continue-on-error: true
        id: pytest

      - name: Create CML report
        if: github.event_name == 'pull_request'
        uses: iterative/setup-cml@v3

      - name: Publish CML comment on PR
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## CI Test Report" > report.md
          echo "" >> report.md
          if [ "${{ steps.pytest.outcome }}" = "success" ]; then
            echo "✅ **All tests passed**" >> report.md
          else
            echo "❌ **Some tests failed**" >> report.md
          fi
          echo "" >> report.md
          echo "### Pytest output" >> report.md
          echo '```text' >> report.md
          tail -n 30 pytest_output.txt >> report.md
          echo '```' >> report.md
          if [ -f metrics_report.txt ]; then
            echo "" >> report.md
            cat metrics_report.txt >> report.md
          fi
          cml comment create report.md

      - name: Fail job if tests failed
        if: steps.pytest.outcome == 'failure'
        run: exit 1

